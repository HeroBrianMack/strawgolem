plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT' apply(false)
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.7" apply(false)
    id 'org.spongepowered.gradle.vanilla' version '0.2.1-SNAPSHOT' apply(false)
}

subprojects {
    apply plugin: 'java'

    java.toolchain.languageVersion = JavaLanguageVersion.of(17)
    java.withSourcesJar()

    jar {
        from(rootProject.file("LICENSE")) {
            rename { "${it}_${mod_name}" }
        }
        manifest {
            attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : authors,
                'Specification-Version'   : project.jar.archiveVersion,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Timestamp'               : System.currentTimeMillis(),
                'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                'Built-On-Minecraft'      : minecraft_version
            ])
        }
    }

    sourcesJar {
        from(rootProject.file("LICENSE")) {
            rename { "${it}_${mod_name}" }
        }
    }

    repositories {
        mavenCentral()
        maven {
            name = 'Sponge / Mixin'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'BlameJared Maven (JEI / CraftTweaker / Bookshelf)'
            url = 'https://maven.blamejared.com'
        }
        maven {
            name = 'Curse Maven'
            url = "https://www.cursemaven.com"
        }
        maven {
            name = 'GeckoLib'
            url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        }
//        maven { url 'https://repo.ryandw11.com/repository/maven-releases/' }
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/"
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = "Shedaniel Maven"
                    url = uri("https://maven.shedaniel.me")
                }
            }
            filter {
                includeGroup("me.shedaniel.cloth")
            }
        }
        maven { url 'https://maven.blamejared.com' }
        maven {
            url = "https://api.modrinth.com/maven"
        }
    }

    tasks.withType(JavaCompile).configureEach {
    
        it.options.encoding = 'UTF-8'
        it.options.getRelease().set(17)
    }

    processResources {
        Map<String, ?> expandProps = new HashMap<>()
//        project.properties.each{ key, value ->
//            expandProps.put(key, value);
//        }
        project.properties.each{ key, value ->
            if (value instanceof String || value instanceof Number || value instanceof Boolean) {
                expandProps.put(key, value)
            }
        }
        filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', '*.mixins.json']) {
            expand(expandProps)
        }
        inputs.properties(expandProps)
    }

    // Disables Gradle's custom module metadata from being published to maven. The
    // metadata includes mapped dependencies which are not reasonably consumable by
    // other mod developers.
    tasks.withType(GenerateModuleMetadata).configureEach {

        enabled = false
    }
}
