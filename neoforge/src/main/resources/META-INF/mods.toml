modLoader = "javafml" #mandatory
loaderVersion = "${neoforge_loader_version_range}" #mandatory
license = "${license}" # Review your options at https://choosealicense.com/.
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional
[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "${mod_name}" #mandatory
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional (see https://docs.neoforged.net/docs/misc/updatechecker/)
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional (displayed in the mod UI)
logoFile = "icon.png" #optional
credits="${credits}" #optional
authors = "${authors}" #optional
description = '''${description}''' #mandatory (Supports multiline text)
[[mixins]]
config = "${mod_id}.mixins.json"
[[mixins]]
config = "${mod_id}.neoforge.mixins.json"
# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.${mod_id}]]
modId = "neoforge" #mandatory
mandatory = true #mandatory
versionRange="${neo_version_range}" #mandatory
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "haybalelib"
mandatory = true
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "geckolib"
mandatory = true
versionRange = "*"
ordering = "BEFORE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "cloth-config"
mandatory = false
versionRange = "*"
ordering = "BEFORE"
side = "CLIENT"
[[dependencies.${mod_id}]]
modId = "modmenu"
mandatory = false
versionRange = "*"
side = "CLIENT"
[[dependencies.${mod_id}]]
modId = "jade"
mandatory = false
versionRange = "*"
side = "CLIENT"